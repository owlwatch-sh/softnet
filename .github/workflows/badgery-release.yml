name: Owlwatch Release

# Owlwatch's builds of this fork: arm64 only, signed with Owlwatch's Developer ID
# and notarized, rather than ad-hoc signed
#
# A tag builds, signs and publishes a release. A push to the default branch only
# builds, to save the cache: a tag's run can restore caches from the default
# branch but not from earlier tags

on:
  push:
    branches:
      - badgery
    tags:
      - "*-owlwatch.*"

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'owlwatch-sh/softnet'
    name: Release
    runs-on: macos-26
    timeout-minutes: 60
    # Only a tag's run signs, in the release environment: its tag rule
    # (*-owlwatch.*) and reviewer are the gate, and its subject is the one
    # Doppler's release identity trusts. A push to badgery builds unsigned.
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || '' }}
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ github.ref_name }}
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install release target
        id: rust
        run: |
          rustup target add aarch64-apple-darwin
          echo "version=$(rustc --version | tr -c 'a-zA-Z0-9.\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache crates and build products
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: softnet-arm64-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            softnet-arm64-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-
            softnet-arm64-${{ steps.rust.outputs.version }}-
      - name: Build
        run: |
          SOFTNET_VERSION="$VERSION-$(git rev-parse --short HEAD)" \
            cargo build --release --locked --target aarch64-apple-darwin
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/softnet dist/softnet
      - name: Read Apple signing credentials from Doppler
        id: doppler
        if: env.RELEASE == 'true'
        env:
          DOPPLER_IDENTITY: ${{ vars.DOPPLER_IDENTITY }}
          SECRETS: MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_KEY MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID
        run: |
          # Signs in to Doppler by OIDC, as owlwatch-sh/owlwatch's release jobs do
          # (its docs/doppler.md): this job's ID token, issued in the release
          # environment, for a short-lived token that reads the release config.
          # Every value is masked before anything is written; nothing is printed.
          set -euo pipefail
          if ! [[ "$DOPPLER_IDENTITY" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "::error::set DOPPLER_IDENTITY in this repository's release environment"
            exit 1
          fi
          id=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=doppler" | jq -r '.value // empty')
          [ -n "$id" ] || { echo "::error::no GitHub OIDC token for this job"; exit 1; }
          echo "::add-mask::$id"
          token=$(jq -n --arg identity "$DOPPLER_IDENTITY" --arg token "$id" '{identity: $identity, token: $token}' |
            curl -fsS -X POST -H 'Content-Type: application/json' --data @- https://api.doppler.com/v3/auth/oidc | jq -r '.token // empty')
          [ -n "$token" ] || { echo "::error::Doppler refused this job's sign-in"; exit 1; }
          echo "::add-mask::$token"
          values="$RUNNER_TEMP/doppler.json"
          trap 'rm -f "$values"' EXIT
          curl -fsS -G -H "Authorization: Bearer $token" -H 'Accept: application/json' \
            --data-urlencode project=owlwatch --data-urlencode config=release --data-urlencode format=json \
            --data-urlencode "secrets=${SECRETS// /,}" https://api.doppler.com/v3/configs/config/secrets/download > "$values"
          jq -r '.[] | strings | split("\n")[] | select(length > 0) | "::add-mask::" + .' "$values"
          for name in $SECRETS; do
            value=$(jq -r --arg name "$name" '.[$name] // empty' "$values")
            [ -n "$value" ] || { echo "::error::Doppler owlwatch/release has no value for $name"; exit 1; }
            delimiter="doppler_$(openssl rand -hex 16)"
            printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "$value" "$delimiter" >> "$GITHUB_OUTPUT"
          done
      - name: Import signing certificate
        if: env.RELEASE == 'true'
        env:
          MACOS_SIGN_P12: ${{ steps.doppler.outputs.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ steps.doppler.outputs.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ steps.doppler.outputs.MACOS_NOTARY_KEY }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          echo "$MACOS_NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$RUNNER_TEMP/build.keychain" \
            -P "$MACOS_SIGN_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$RUNNER_TEMP/build.keychain"
          security list-keychain -d user -s "$RUNNER_TEMP/build.keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Sign and notarize
        if: env.RELEASE == 'true'
        env:
          MACOS_NOTARY_KEY_ID: ${{ steps.doppler.outputs.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ steps.doppler.outputs.MACOS_NOTARY_ISSUER_ID }}
        run: |
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain" \
            | sed -n 's/.*\([0-9A-F]\{40\}\) "Developer ID Application: .*/\1/p' | head -n 1)
          codesign \
            --force \
            --verbose \
            --sign "$IDENTITY" \
            --identifier softnet \
            --timestamp \
            --options runtime \
            --keychain "$RUNNER_TEMP/build.keychain" \
            dist/softnet
          codesign --verify --strict --verbose=2 dist/softnet
          dist/softnet --version

          # A bare executable cannot be stapled; Gatekeeper finds the ticket online
          ditto -c -k dist/softnet "$RUNNER_TEMP/softnet-notarization.zip"
          xcrun notarytool submit "$RUNNER_TEMP/softnet-notarization.zip" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" \
            --wait \
            --timeout 20m

          tar -C dist -czf softnet.tar.gz softnet
          shasum -a 256 softnet.tar.gz dist/softnet | tee SHA256SUMS
          codesign --display --requirements - dist/softnet 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" softnet.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --notes "Owlwatch build of Softnet $VERSION: arm64, signed and notarized by Owlwatch (Bright Shore Technologies). Upstream's source, unchanged."
      - name: Remove signing material
        if: always() && env.RELEASE == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/certificate.p12"
